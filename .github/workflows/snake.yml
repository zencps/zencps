name: generate snake animation

on:
  schedule:
    - cron: "0 */6 * * *"   
  workflow_dispatch:         
  push:
    branches: [main]        

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zencps
          token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=F72585&color_dots=#ebedf0,#9D4EDD,#C77DFF,#00F5FF,#F72585
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=F72585&color_dots=#21262d,#30363d,#9D4EDD,#00F5FF,#F72585

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}